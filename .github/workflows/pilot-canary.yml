name: Pilot Synthetic Pipeline Canary

# TASK-379 V8 (scenario abstraction added by TASK-403 A2): proves the
# deployed daemon still ships code end-to-end (poll -> spec -> execute ->
# PR -> merge) by filing a real issue on a sandbox repo and watching it
# travel through the real pipeline. Runs from outside the daemon (GitHub
# Actions) so it survives daemon death.
#
# Each job below is one scenario, calling the shared
# `pilot-canary-scenario.yml` reusable workflow with its own issue
# title/body and terminal-condition assertion. Guards, sandbox labels, and
# alert titles are scoped per scenario (`canary-scenario-<name>`) so
# scenarios never collide on idempotency or alert dedup. Add a new
# scenario by adding a new job here -- no changes to the reusable workflow
# or scripts/canary-poll.sh are required unless the scenario needs a
# terminal condition the poll script doesn't support yet.
#
# Modeled on the existing production precedent:
# .github/workflows/brew-tap-token-canary.yml (schedule -> check ->
# idempotent `gh issue create` on failure).

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  version-bump:
    uses: ./.github/workflows/pilot-canary-scenario.yml
    secrets:
      canary_gh_token: ${{ secrets.CANARY_GH_TOKEN }}
    with:
      scenario_name: version-bump
      sandbox_repo: qf-studio/pilot-canary-sandbox
      alert_repo: qf-studio/pilot
      assert_mode: merged
      # Must exceed the poller's in-memory retry grace period (GH-2201,
      # internal/adapters/github/poller.go:428, default 5m) so a
      # slow-but-working run does not false-alarm.
      timeout_minutes: 35
      poll_interval_seconds: 60
      issue_title: "chore(version): bump patch for canary run"
      issue_body: |
        ## Context

        Synthetic canary run (TASK-379 V8, scenario `version-bump`). This
        issue exists to prove the deployed Pilot daemon still ships code
        end-to-end (poll -> spec -> execute -> PR -> merge).

        ## Acceptance

        - [ ] Read the current PATCH component of the `Version` constant in
              `version.go` and increment it by exactly one (current+1). Do
              not assume a starting value -- derive the target from what is
              in the file.
        - [ ] Change only that single line so `version_test.go` (semver
              guard) stays green.
        - [ ] Do not touch any other file.

        ## Implementation

        Edit the `const Version` line in `version.go`. Nothing else.

  # Stub scenario (commented out, not a live job) proving the abstraction
  # scales to a second, independently scoped scenario -- epic-lifecycle
  # coverage, TASK-403 A3. It demonstrates a second scenario is added as a
  # plain job, with its own labels (canary-scenario-epic-lifecycle) and
  # alert title ([canary:epic-lifecycle] pipeline stall), without touching
  # the version-bump job, the reusable workflow, or
  # scripts/canary-poll.sh. TASK-403 A3 will flesh out the real issue
  # template and implement the `n-children-merged` assert mode in
  # scripts/canary-poll.sh, then uncomment (and un-stub) a job like this.
  #
  # epic-lifecycle-stub:
  #   uses: ./.github/workflows/pilot-canary-scenario.yml
  #   secrets:
  #     canary_gh_token: ${{ secrets.CANARY_GH_TOKEN }}
  #   with:
  #     scenario_name: epic-lifecycle
  #     sandbox_repo: qf-studio/pilot-canary-sandbox
  #     alert_repo: qf-studio/pilot
  #     assert_mode: n-children-merged
  #     timeout_minutes: 35
  #     poll_interval_seconds: 60
  #     issue_title: "chore(epic): canary epic-lifecycle scenario (TASK-403 A3)"
  #     issue_body: |
  #       Epic-lifecycle scenario body -- see TASK-403 A3.
