name: Pilot Canary Scenario

# Reusable workflow (TASK-403 A2): one call site per scenario, invoked from
# pilot-canary.yml. Guards, sandbox labels, and alert titles are scoped by
# `scenario_name` so multiple scenarios can run against the same sandbox
# repo without colliding on idempotency checks or alert dedup.
#
# Do not edit this file to add a scenario -- add a caller job in
# pilot-canary.yml instead. Only change this file (or
# scripts/canary-poll.sh) when a scenario needs a terminal condition the
# poll script doesn't support yet (see canary-poll.sh's --assert contract).

on:
  workflow_call:
    inputs:
      scenario_name:
        description: "Short scenario id, used in labels/alert titles (e.g. version-bump)"
        required: true
        type: string
      sandbox_repo:
        description: "owner/name of the sandbox repo the canary issue is filed on"
        required: true
        type: string
      alert_repo:
        description: "owner/name of the repo to file the pipeline-stall alert issue on"
        required: true
        type: string
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      assert_mode:
        description: "Terminal condition passed through to scripts/canary-poll.sh --assert"
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      poll_interval_seconds:
        required: true
        type: number
    secrets:
      canary_gh_token:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SCENARIO_LABEL: canary-scenario-${{ inputs.scenario_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Idempotency guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
        run: |
          set -euo pipefail

          OPEN_COUNT=$(gh issue list \
            --repo "${{ inputs.sandbox_repo }}" \
            --label pilot \
            --label "$SCENARIO_LABEL" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_COUNT" -gt 0 ]; then
            echo "A pilot-labeled canary issue for scenario '${{ inputs.scenario_name }}' is already open on ${{ inputs.sandbox_repo }} — a prior run is still in flight. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open canary issue for scenario '${{ inputs.scenario_name }}' found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File synthetic canary issue
        id: file_issue
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
        run: |
          set -euo pipefail

          ISSUE_URL=$(gh issue create \
            --repo "${{ inputs.sandbox_repo }}" \
            --title "${{ inputs.issue_title }}" \
            --label pilot \
            --label "$SCENARIO_LABEL" \
            --body "${{ inputs.issue_body }}")

          ISSUE_NUMBER=$(basename "$ISSUE_URL")
          echo "Filed canary issue ${{ inputs.sandbox_repo }}#$ISSUE_NUMBER (scenario: ${{ inputs.scenario_name }})"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Poll for pipeline progression
        id: poll
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
        run: |
          set -euo pipefail
          bash scripts/canary-poll.sh \
            --repo "${{ inputs.sandbox_repo }}" \
            --issue "${{ steps.file_issue.outputs.issue_number }}" \
            --timeout-minutes "${{ inputs.timeout_minutes }}" \
            --poll-interval-seconds "${{ inputs.poll_interval_seconds }}" \
            --assert "${{ inputs.assert_mode }}"

      - name: Close canary issue on success
        if: steps.guard.outputs.skip != 'true' && steps.poll.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${{ steps.file_issue.outputs.issue_number }}"
          STATE=$(gh issue view "$ISSUE_NUMBER" --repo "${{ inputs.sandbox_repo }}" --json state --jq '.state')

          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --repo "${{ inputs.sandbox_repo }}" \
              --comment "Canary PR #${{ steps.poll.outputs.pr_number }} merged — pipeline verified end-to-end (scenario: ${{ inputs.scenario_name }})."
          else
            echo "Canary issue already closed (auto-closed by merge)."
          fi

      - name: File deduped pipeline-stall alert
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TITLE="[canary:${{ inputs.scenario_name }}] pipeline stall"
          STAGE="${{ steps.poll.outputs.stage || 'issue-filed' }}"
          ISSUE_NUMBER="${{ steps.file_issue.outputs.issue_number }}"

          EXISTING=$(gh issue list \
            --repo "${{ inputs.alert_repo }}" \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Alert issue #$EXISTING already open — adding status comment."
            gh issue comment "$EXISTING" \
              --repo "${{ inputs.alert_repo }}" \
              --body "Canary re-triggered $(date -u '+%Y-%m-%d %H:%M UTC'): stalled at stage \`$STAGE\` (canary issue ${{ inputs.sandbox_repo }}#$ISSUE_NUMBER, scenario \`${{ inputs.scenario_name }}\`)."
          else
            echo "Creating new alert issue."
            gh issue create \
              --repo "${{ inputs.alert_repo }}" \
              --title "$TITLE" \
              --label bug \
              --body "Synthetic end-to-end pipeline canary stalled at stage \`$STAGE\` (scenario \`${{ inputs.scenario_name }}\`). Canary issue: ${{ inputs.sandbox_repo }}#$ISSUE_NUMBER. Investigate daemon health (poll -> spec -> execute -> PR -> merge). See TASK-403."
          fi
