name: Pilot Canary Scenario

# Reusable workflow (TASK-403 A2): one call site per scenario, invoked from
# pilot-canary.yml. Guards, sandbox labels, and alert titles are scoped by
# `scenario_name` so multiple scenarios can run against the same sandbox
# repo without colliding on idempotency checks or alert dedup.
#
# Do not edit this file to add a scenario -- add a caller job in
# pilot-canary.yml instead. Only change this file (or
# scripts/canary-poll.sh) when a scenario needs a terminal condition the
# poll script doesn't support yet (see canary-poll.sh's --assert contract).

on:
  workflow_call:
    inputs:
      scenario_name:
        description: "Short scenario id, used in labels/alert titles (e.g. version-bump)"
        required: true
        type: string
      sandbox_repo:
        description: "owner/name of the sandbox repo the canary issue is filed on"
        required: true
        type: string
      alert_repo:
        description: "owner/name of the repo to file the pipeline-stall alert issue on"
        required: true
        type: string
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      assert_mode:
        description: "Terminal condition passed through to scripts/canary-poll.sh --assert"
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      poll_interval_seconds:
        required: true
        type: number
    secrets:
      canary_gh_token:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SCENARIO_LABEL: canary-scenario-${{ inputs.scenario_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Idempotency guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
          SCENARIO_NAME: ${{ inputs.scenario_name }}
        run: |
          set -euo pipefail

          OPEN_COUNT=$(gh issue list \
            --repo "$SANDBOX_REPO" \
            --label pilot \
            --label "$SCENARIO_LABEL" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_COUNT" -gt 0 ]; then
            echo "A pilot-labeled canary issue for scenario '$SCENARIO_NAME' is already open on $SANDBOX_REPO — a prior run is still in flight. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open canary issue for scenario '$SCENARIO_NAME' found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure scenario label exists
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
        run: |
          set -euo pipefail

          gh label create "$SCENARIO_LABEL" \
            --repo "$SANDBOX_REPO" \
            --color 6f42c1 \
            --description "Canary scenario marker (TASK-403)" \
            --force

      - name: File synthetic canary issue
        id: file_issue
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_BODY: ${{ inputs.issue_body }}
          SCENARIO_NAME: ${{ inputs.scenario_name }}
        run: |
          set -euo pipefail

          ISSUE_URL=$(gh issue create \
            --repo "$SANDBOX_REPO" \
            --title "$ISSUE_TITLE" \
            --label pilot \
            --label "$SCENARIO_LABEL" \
            --body "$ISSUE_BODY")

          ISSUE_NUMBER=$(basename "$ISSUE_URL")
          echo "Filed canary issue $SANDBOX_REPO#$ISSUE_NUMBER (scenario: $SCENARIO_NAME)"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Poll for pipeline progression
        id: poll
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
          ASSERT_MODE: ${{ inputs.assert_mode }}
        run: |
          set -euo pipefail
          bash scripts/canary-poll.sh \
            --repo "$SANDBOX_REPO" \
            --issue "${{ steps.file_issue.outputs.issue_number }}" \
            --timeout-minutes "${{ inputs.timeout_minutes }}" \
            --poll-interval-seconds "${{ inputs.poll_interval_seconds }}" \
            --assert "$ASSERT_MODE"

      - name: Close canary issue on success
        if: steps.guard.outputs.skip != 'true' && steps.poll.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.canary_gh_token }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
          SCENARIO_NAME: ${{ inputs.scenario_name }}
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${{ steps.file_issue.outputs.issue_number }}"
          STATE=$(gh issue view "$ISSUE_NUMBER" --repo "$SANDBOX_REPO" --json state --jq '.state')

          PR_NUMBER="${{ steps.poll.outputs.pr_number }}"
          if [ -n "$PR_NUMBER" ]; then
            COMMENT="Canary PR #$PR_NUMBER merged — pipeline verified end-to-end (scenario: $SCENARIO_NAME)."
          else
            COMMENT="Canary verified end-to-end — all terminal assertions passed (scenario: $SCENARIO_NAME)."
          fi

          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --repo "$SANDBOX_REPO" \
              --comment "$COMMENT"
          else
            echo "Canary issue already closed (auto-closed by merge)."
          fi

      - name: Report scenario result to tracker issue
        # Runs on both success and failure (unlike the old failure()-only
        # alert step) so scripts/canary-report.py can track the green
        # streak needed to auto-close the tracker (GH-4348). It maintains
        # ONE mutating `<!-- canary-status -->` comment per tracker issue
        # instead of appending a new comment on every failed run (evidence:
        # #4265 accumulated 10 duplicate comments in 3 days).
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_REPO: ${{ inputs.alert_repo }}
          SANDBOX_REPO: ${{ inputs.sandbox_repo }}
          SCENARIO_NAME: ${{ inputs.scenario_name }}
          RESULT: ${{ steps.poll.outputs.result || 'failure' }}
          FAILED_ASSERTIONS: ${{ steps.poll.outputs.failed_assertions }}
          ISSUE_NUMBER: ${{ steps.file_issue.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/canary-report.py \
            --alert-repo "$ALERT_REPO" \
            --sandbox-repo "$SANDBOX_REPO" \
            --scenario-name "$SCENARIO_NAME" \
            --result "$RESULT" \
            --failed-assertions "$FAILED_ASSERTIONS" \
            --canary-issue "$ISSUE_NUMBER" \
            --run-url "$RUN_URL" \
            --timestamp "$(date -u '+%Y-%m-%d %H:%M UTC')"
