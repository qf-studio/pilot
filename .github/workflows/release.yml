name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # GH-4523: v2.245.1's release was reported missing the linux
      # tarballs, and nothing in this pipeline would have caught that
      # class of failure. Assert the full asset set landed on the release
      # before we call the train green (see
      # .agent/sops/operations/release-asset-completeness-gate.md for the
      # root-cause writeup).
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-release-assets.sh "${GITHUB_REF_NAME}"

      # Hand the rendered formula to the homebrew-tap job. goreleaser's brews
      # entry has skip_upload: true, so it renders but never pushes.
      - name: Upload Homebrew formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/homebrew/Formula/pilot.rb
          if-no-files-found: error

  # Non-fatal: a tap-token failure (#5615) must not mark a shipped release red.
  homebrew-tap:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Download Homebrew formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula

      - name: Push formula to qf-studio/homebrew-pilot
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          fail() {
            echo "::error::Homebrew tap publish failed: $1 — check the HOMEBREW_TAP_GITHUB_TOKEN secret (see #5615); the GitHub Release itself is unaffected."
            exit 1
          }
          [ -n "${GH_TOKEN}" ] || fail "HOMEBREW_TAP_GITHUB_TOKEN is empty"
          [ -s pilot.rb ] || fail "pilot.rb artifact missing or empty"
          api="repos/qf-studio/homebrew-pilot/contents/Formula/pilot.rb"
          # Current sha is required for the PUT to update instead of conflict;
          # absent file (404) means create.
          sha=""
          if out=$(gh api "${api}" --jq .sha 2>&1); then
            sha="${out}"
          elif ! echo "${out}" | grep -q "HTTP 404"; then
            fail "reading current formula sha: ${out}"
          fi
          args=(-X PUT "${api}" -f "message=pilot ${TAG}" -f "content=$(base64 -w0 pilot.rb)")
          if [ -n "${sha}" ]; then args+=(-f "sha=${sha}"); fi
          out=$(gh api "${args[@]}" 2>&1) || fail "PUT ${api}: ${out}"
          echo "Published pilot ${TAG} formula to qf-studio/homebrew-pilot"
