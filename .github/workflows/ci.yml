name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  secret-patterns:
    name: Check Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for realistic secret patterns in tests
        run: ./scripts/check-secret-patterns.sh

  mock-contracts:
    name: Check Argument-Discarding Mocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for argument-discarding Backend.Execute mocks
        run: ./scripts/check-mocks.sh

  destructive-call-gate:
    name: Check Destructive-Call Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for destructive-call-gate bypasses
        run: ./scripts/check-destructive-calls.sh

  graph-check:
    name: Knowledge Graph Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check knowledge-graph drift
        run: python3 scripts/check-graph.py

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Check docs/.gitlab-ci.yml script YAML validity
        run: python3 scripts/check-gitlab-ci-yaml.py

      - name: Run checker tests
        run: python3 -m unittest discover -s scripts -p "*_test.py"

  box-scripts:
    name: Box Scripts (ShellCheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts/box

      - name: Run pilot-backup-s3 test suite
        run: ./scripts/box/pilot-backup-s3_test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v $(go list ./... | grep -v /desktop)

      - name: Test
        # GH-5185: `go test`'s default -timeout is 10m (600s) per package
        # test binary. internal/memory and internal/executor are large
        # -race suites (subprocess/worktree-heavy) that run close to that
        # wall on shared/slow runners, so main intermittently flapped red
        # on a plain 600.0xxs kill with no code at fault (runs 32727733048,
        # 32733207554 — both post-merge, diffs untouched the failing
        # packages). Budget: 20m gives ~2x headroom over the observed
        # worst case without masking a real hang (CI would still catch a
        # runaway test well before 20m).
        run: go test -v -race -timeout 20m -coverprofile=coverage.out $(go list ./... | grep -v /desktop)

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v2.0.2 was built with go1.24 and refuses the go 1.25 target
          # (TASK-390 bumped the toolchain for grot); 2.8.0 matches local.
          version: v2.8.0
          args: --timeout=5m
          # 2026-08-18 incident: the action's analysis cache poisons itself —
          # every green run saves a cache whose NEXT restore yields 6 phantom
          # SA5011s in untouched adapter test files (staticcheck loses the
          # t.Fatal noreturn fact), so autopilot closed 4 green PRs in a row
          # (#4956/#4958/#4960/#4969/#4971/#4973 chain). Fresh-cache runs are
          # deterministically green. Trade ~1min of lint time for correctness.
          skip-cache: true
          # GH-5087: `verify: true` (the action's default) runs
          # `golangci-lint config verify`, which fetches the JSON schema
          # from https://golangci-lint.run at runtime. On 2026-08-21 that
          # fetch hit `context deadline exceeded` and failed lint on
          # PR#5082 whose code was never actually linted — autopilot closed
          # the green PR and spawned a phantom fix issue (#5083). Config
          # verification is only load-bearing when .golangci.yml changes,
          # so it now runs in the separate `config-verify` job below
          # instead of on every PR's hot path.
          verify: false

  # GH-5087: schema verification for .golangci.yml, split out of the
  # per-PR lint job (see the `verify: false` note above). Only runs when
  # .golangci.yml itself changes, so the remote schema-host dependency
  # can no longer fail unrelated PRs — but a config change still gets
  # verified before merge.
  config-verify:
    name: golangci-lint Config Verify
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether .golangci.yml changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" -- .golangci.yml | grep -qx '.golangci.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint config verify
        if: steps.changed.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --timeout=5m
          skip-cache: true
