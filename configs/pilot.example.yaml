# Pilot Configuration
# Copy this to ~/.pilot/config.yaml and customize

version: "1.0"

# Gateway server settings
gateway:
  host: "127.0.0.1"
  port: 9090

# Authentication
auth:
  type: "claude-code"  # "claude-code" (local) or "api-token" (remote)
  # token: "${PILOT_GATEWAY_TOKEN}"  # Required if type is "api-token"; ${ENV_VAR} is expanded on load.
  # A non-empty api-token here enforces bearer auth (`Authorization: Bearer <token>`)
  # on every /api/v1/* route (GH-4784) — required once the gateway binds beyond
  # loopback (e.g. a reverse proxy). Leaving type "claude-code" or token empty
  # keeps /api/v1 open, matching pre-GH-4784 behavior.
  # ANTHROPIC_API_KEY env var enables Claude API features (Haiku subtask parsing, etc.)

# Conversational Bot (GH-3665+)
# When enabled, chat / greeting / Q&A / issue-intake intents are answered directly
# via the Anthropic API (~1-2s) instead of the full Claude Code executor (15-30s).
# Requires ANTHROPIC_API_KEY or an explicit api_key.
# Leave disabled (default) to keep the existing executor-only behavior unchanged.
# bot:
#   enabled: false
#
#   model: "claude-haiku-4-5-20251001"   # Model for chat/intake; Haiku is fast & cheap
#   answer_model: ""                     # Override for Q&A calls (defaults to model)
#   api_key: ""                          # Explicit key; falls back to ANTHROPIC_API_KEY env var
#
#   # Persona: injected verbatim at the top of every system prompt
#   # (Chat, Answer, DraftIssue). Leave blank for the built-in "You are Pilot…" default.
#   # Example: "You are a friendly Go development assistant for the Acme team."
#   persona: ""
#
#   # Bounded file-retrieval for grounded codebase Q&A (~2-4s, cites real file paths).
#   # Questions too broad to answer with local context fall through to the executor.
#   retrieval:
#     enabled: false
#     max_files: 8        # Max source files fed to the LLM per question
#     max_bytes: 24000    # Max total bytes of file content per question
#
#   # Conversational issue intake: freeform "I need a task for X" → structured GitHub issue.
#   # The drafted issue always receives the "pilot" label so the daemon picks it up.
#   issue_intake:
#     auto_label_pilot: true
#
#   # Voice scaffold: when enabled, transcribed voice messages (VoiceText field populated
#   # by the adapter's transcription middleware) are routed through the same
#   # intent→responder path as regular text. Actual call/audio wiring is deferred.
#   voice:
#     enabled: false
#
#   # Rate limiting: bot LLM calls are bounded by the adapter-level rate_limit config
#   # (adapters.telegram.rate_limit / adapters.slack.rate_limit). The shared comms.Handler
#   # applies AllowMessage() before every dispatch, so all bot paths are already capped.

# Adapters
adapters:
  # Telegram - Chat-based task execution
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"    # Your user/chat ID for notifications
    # Forum supergroups only (groups with Topics enabled): post task lifecycle
    # notifications and approval prompts into one topic instead of General.
    # The id is the topic's message_thread_id — the middle segment of a topic
    # message link (https://t.me/c/<chat>/<topic>/<msg>). Omit or 0 for
    # non-forum chats. Approval prompts addressed to an individual approver
    # (approvers[0] is a chat id) ignore this and go to that chat directly.
    # message_thread_id: 12
    transcription:
      provider: openai
      openai_key: "${OPENAI_API_KEY}"  # For voice message transcription
    # LLM-based intent classification (uses Claude Haiku for accurate intent detection)
    llm_classifier:
      enabled: false                   # Enable for better intent detection vs regex
      # api_key: ""                    # Optional - uses ANTHROPIC_API_KEY env var if not set
      timeout_seconds: 2               # Max time for classification
      history_size: 10                 # Messages to keep per chat for context
      history_ttl: 30m                 # TTL for conversation history
    # Rate limiting to prevent abuse
    rate_limit:
      enabled: true
      requests_per_minute: 30
      burst: 5

  # GitHub - Issue polling and PR creation
  github:
    enabled: false
    token: "${GITHUB_TOKEN}"
    # GitHub App installation-token auth (GH-4743) — preferred over the
    # token/GITHUB_TOKEN fallback above. Kills the gh-CLI-OAuth single point
    # of failure and gets the installation its own rate pool instead of
    # sharing the daemon's 5000/hr with every interactive session (#4391).
    # When set, the daemon mints a short-lived installation access token
    # (JWT -> POST /app/installations/{id}/access_tokens), caches it, and
    # refreshes proactively before the ~1h expiry. Used for both the GitHub
    # API client and git push/fetch credentials on pilot worktrees. On mint
    # failure it logs loudly and falls back to `token`/`GITHUB_TOKEN` above.
    # All three fields are required together — a partial block fails fast
    # at startup naming the missing field. See
    # .agent/sops/config/github-token-architecture.md for the full writeup.
    # app:
    #   app_id: 123456                  # GitHub App ID (App settings page)
    #   installation_id: 78901234       # Installation ID for this org/repo
    #   private_key_path: "/etc/pilot/github-app.pem"  # App's PEM private key
    repo: "owner/repo"                 # Repository to poll
    pilot_label: "pilot"               # Issues with this label are picked up
    # use_sdk_poller: false            # Opt into the studio-sdk GitHub issue poller. Full
    #                                  # host-hook parity: board source/sync (default repo
    #                                  # only), rate-limit retry scheduling, pre-flight judge,
    #                                  # execution checkers, issue metrics. Covers the DEFAULT
    #                                  # repo above AND every `projects:` github repo. Runs
    #                                  # execution mode auto only — keep false with
    #                                  # execution.mode: sequential. Deprecated: the in-tree
    #                                  # GitHub poller is being retired (M7 4d.6) and this flag
    #                                  # will be ignored once the SDK poller is unconditional.
    polling:
      enabled: true
      interval: 30s
      label: "pilot"
    # GitHub Projects V2 board integration — full board-driven lifecycle loop.
    # When source_enabled is true, the board (not the pilot label) is the source of
    # truth: cards flow Todo -> In Progress -> In Review -> Done, and -> Blocked on
    # failure. All transitions no-op safely when the board is disabled, the issue is
    # off-board, or the card is already in the target column (idempotent).
    # project_board:
    #   enabled: true                  # Sync issue status to the board (write path)
    #   project_number: 1              # Project number from the board URL
    #   status_field: "Status"         # Name of the single-select status field
    #   statuses:
    #     in_progress: "In Progress"   # written on issue pickup
    #     review: "In Review"          # written on PR open
    #     done: "Done"                 # written on PR merge
    #     failed: "Blocked"            # written on exec / CI failure
    #   source_enabled: false          # Pull work FROM the board instead of by label
    #   source_status: "Todo"          # Board column to source issues from (default "Todo")

  # GitLab - Issue polling and MR creation
  gitlab:
    enabled: false
    token: "${GITLAB_TOKEN}"
    base_url: "https://gitlab.com"     # Or self-hosted instance URL
    project: "namespace/project"       # Project path
    pilot_label: "pilot"               # Issues with this label are picked up
    webhook_secret: "${GITLAB_WEBHOOK_SECRET}"
    polling:
      enabled: true
      interval: 30s
      label: "pilot"
    stale_label_cleanup:
      enabled: true
      interval: 30m
      threshold: 1h

  # Azure DevOps - Work item polling and PR creation
  azure_devops:
    enabled: false
    pat: "${AZURE_DEVOPS_PAT}"         # Personal Access Token
    organization: "my-org"             # Azure DevOps organization
    project: "my-project"              # Project name
    repository: "my-repo"              # Repository name (optional, defaults to project)
    base_url: "https://dev.azure.com"  # Or Azure DevOps Server URL
    pilot_tag: "pilot"                 # Work items with this tag are picked up
    webhook_secret: "${AZURE_DEVOPS_WEBHOOK_SECRET}"
    work_item_types:                   # Which work item types to process
      - "Bug"
      - "Task"
      - "User Story"
    polling:
      enabled: true
      interval: 30s
    stale_label_cleanup:
      enabled: true
      interval: 30m
      threshold: 1h

  # Linear - Issue tracking (webhooks)
  linear:
    enabled: false
    api_key: "${LINEAR_API_KEY}"
    team_id: "your-team-id"
    pilot_label: "pilot"    # Issues with this label are picked up
    auto_assign: true        # Auto-assign issues to Pilot
    # webhook_public_key: |  # Ed25519 public key from Linear workspace settings → API → Webhooks
    #   -----BEGIN PUBLIC KEY-----
    #   MCowBQYDK2VwAyEA...
    #   -----END PUBLIC KEY-----

  # Plane.so - Open-source project planning (cloud or self-hosted)
  plane:
    enabled: false
    base_url: "https://api.plane.so"   # Or self-hosted URL e.g. "https://plane.mycompany.com"
    api_key: "${PLANE_API_KEY}"
    webhook_secret: "${PLANE_WEBHOOK_SECRET}"
    workspace_slug: "my-team"          # Your Plane workspace slug
    project_ids:                       # Projects to poll for pilot-labeled issues
      - "project-uuid-1"
    pilot_label: "pilot"               # Issues with this label are picked up
    polling:
      enabled: true
      interval: 30s

  # Discord - Chat-based task execution via Discord bot
  discord:
    enabled: false
    bot_token: "${DISCORD_BOT_TOKEN}"
    allowed_guilds: []       # Guild IDs (empty = all)
    allowed_channels: []     # Channel IDs (empty = all)
    command_prefix: "/"
    # LLM-based intent classification (uses Claude Haiku for accurate intent detection)
    llm_classifier:
      enabled: false                   # Enable for better intent detection vs regex
      # api_key: ""                    # Optional - uses ANTHROPIC_API_KEY env var if not set
      history_size: 10                 # Messages to keep per channel for context
      history_ttl: 30m                 # TTL for conversation history

  # Slack - Notifications + Socket Mode chat
  slack:
    enabled: false
    bot_token: "${SLACK_BOT_TOKEN}"
    channel: "#dev-notifications"
    # LLM-based intent classification (uses Claude Haiku for accurate intent detection)
    # When enabled, phrases like "check the pilot queue" are classified correctly
    # (as question/research) instead of defaulting to task via regex.
    llm_classifier:
      enabled: false                   # Enable for better intent detection vs regex
      # api_key: ""                    # Optional - uses ANTHROPIC_API_KEY env var if not set
      history_size: 10                 # Messages to keep per channel for context
      history_ttl: 30m                 # TTL for conversation history

  # Chat - HTTP transport backing the console's Operator chat panel (GH-4835).
  # Feeds the same comms brain as Telegram/Slack/Discord via a per-conversation,
  # in-memory poll-drain event buffer (no SSE/WS, no chat-history persistence).
  # Routes (bearer auth inherited from `auth:` above; absent entirely when
  # disabled): POST /api/v1/chat/messages, GET
  # /api/v1/chat/conversations/{id}/events?after=<seq>. Approval decisions do
  # NOT go through this API — the console calls
  # POST /api/v1/approvals/{requestId}/decision directly.
  chat:
    enabled: false
    rate_limit:
      enabled: true
      messages_per_minute: 20
      tasks_per_hour: 10
      burst_size: 5

# Conversational bot module
# When enabled, chat / greeting / question intents are answered directly via the
# Anthropic API (~1-2s) instead of spinning up the Claude Code executor (15-30s).
# Disabled (default) => behavior is identical to before: those intents use the executor.
bot:
  enabled: false                       # Master switch for the fast conversational path
  model: "claude-haiku-4-5-20251001"   # Model for chat / greeting (fast, cheap)
  answer_model: ""                     # Model for grounded code Q&A; defaults to `model` when empty
  # api_key: ""                        # Optional - uses ANTHROPIC_API_KEY env var if not set
  persona: ""                          # Optional - prepended to the system prompt (Pilot's "voice")

  # Bounded file-retrieval for codebase questions (answers in ~2-4s; too-broad
  # questions fall back to the executor automatically).
  retrieval:
    enabled: false
    max_files: 8                       # Max files to read into the answer context
    max_bytes: 24000                   # Max total bytes of file excerpts

  # Conversational issue intake: turn a freeform message into a structured issue.
  issue_intake:
    auto_label_pilot: true             # Tag drafted issues "pilot" so the daemon auto-picks them

  # Voice scaffold (transport deferred): when enabled, transcribed VoiceText flows
  # through the same intent->responder path as text messages.
  voice:
    enabled: false

# Orchestrator settings
orchestrator:
  model: "claude-opus-4-6"
  max_concurrent: 2          # Max parallel tasks

  # Execution mode (auto, sequential, or parallel)
  execution:
    mode: "auto"               # auto (default): parallel dispatch with scope-overlap guard
                               #   non-overlapping issues run concurrently; overlapping groups
                               #   run oldest-first (safe against merge conflicts)
                               # sequential: one issue at a time, waits for PR merge
                               # parallel: all issues run concurrently (legacy, no overlap guard)
    wait_for_merge: true       # Wait for PR merge before picking next issue (sequential only)
    poll_interval: 30s         # How often to check PR status
    pr_timeout: 1h             # Max time to wait for PR merge

# Executor settings
executor:
  type: "claude-code"          # "claude-code", "opencode", "anthropic-api", or "openai-api"
  auto_create_pr: true         # Create PR by default after task completion
                               # Use --no-pr flag to disable for individual tasks
  # direct_commit: false       # DANGER: Enable direct commit to main (requires --direct-commit flag)
                               # When enabled with flag, skips branches and PRs, pushes directly to main
                               # Intended for users who rely on manual QA instead of code review

  # Non-Anthropic provider routing (GH-2287, GH-2371)
  # Configure once here — Pilot injects ANTHROPIC_BASE_URL/AUTH_TOKEN/MODEL
  # into the Claude Code subprocess env, so ~/.claude/settings.json does not
  # need to change. Leave these unset for default Anthropic behavior.
  # api_base_url: "https://api.z.ai/api/anthropic"   # e.g. Z.AI GLM, OpenRouter Anthropic-compat
  # api_auth_token: "${ZAI_API_KEY}"                  # ${ENV_VAR} is expanded on load
  # default_model: "glm-4.6"                          # model name for the configured provider

  # OpenAI-compatible direct HTTP backend (GH-2382)
  # Use type: "openai-api" to drive Pilot with any OpenAI /v1/chat/completions provider
  # without a CLI wrapper. Supports OpenAI, Synthetic, OpenRouter, Groq, Together,
  # vLLM, Ollama, and any other OpenAI-compatible endpoint.
  #
  # Example: OpenAI
  # type: "openai-api"
  # openai:
  #   api_key: "${OPENAI_API_KEY}"          # ${ENV_VAR} is expanded on load
  #   base_url: "https://api.openai.com/v1" # default
  #   model: "gpt-4o"                       # default
  #
  # Example: Synthetic (hf:moonshotai/Kimi-K2-Instruct)
  # type: "openai-api"
  # openai:
  #   api_key: "${SYNTHETIC_API_KEY}"
  #   base_url: "https://api.synthetic.new/v1"
  #   model: "hf:moonshotai/Kimi-K2-Instruct"
  #
  # Example: OpenRouter
  # type: "openai-api"
  # openai:
  #   api_key: "${OPENROUTER_API_KEY}"
  #   base_url: "https://openrouter.ai/api/v1"
  #   model: "anthropic/claude-sonnet-4"
  #
  # Example: local vLLM / Ollama (no auth needed)
  # type: "openai-api"
  # openai:
  #   api_key: "no-key"
  #   base_url: "http://localhost:11434/v1"
  #   model: "llama3"

  # Worktree isolation - execute tasks in temporary git worktree
  # use_worktree: false        # When true, creates isolated worktree per task
                               # Allows execution even with uncommitted changes in working directory
                               # Useful when Pilot runs in same repo as your development work

  # Effort routing (Opus 4.6) - controls how thoroughly Claude reasons per complexity
  # effort_routing:
  #   enabled: true
  #   trivial: "low"             # Fast, minimal token spend
  #   simple: "medium"           # Balanced
  #   medium: "high"             # Standard (default behavior)
  #   complex: "max"             # Deepest reasoning (Opus 4.6 only)

  # Model routing - select model by task complexity
  # model_routing:
  #   enabled: true
  #   trivial: "claude-haiku"           # Typos, renames ($1/$5 per MTok)
  #   simple: "claude-sonnet-4-6"       # Small fixes, config ($3/$15 per MTok)
  #   medium: "claude-sonnet-4-6"       # Features, endpoints ($3/$15 per MTok)
  #   complex: "claude-opus-4-6"        # Refactors, migrations ($5/$25 per MTok)

  # Smart retry (GH-920) - retry on transient errors with backoff
  # retry:
  #   enabled: true
  #   rate_limit:                 # Rate limit errors (429, quota exceeded)
  #     max_attempts: 3
  #     initial_backoff: 30s      # 30s, 60s, 120s
  #     backoff_multiplier: 2.0
  #   api_error:                  # API errors (auth, server errors)
  #     max_attempts: 3
  #     initial_backoff: 5s       # 5s, 10s, 20s
  #     backoff_multiplier: 2.0
  #   timeout:                    # Timeout errors
  #     max_attempts: 2           # Retry once
  #     extend_timeout: true      # Use 1.5x original timeout on retry
  #     timeout_multiplier: 1.5
  #   oom_killed:                 # OOM-killed subprocess (exit 137/139) (GH-3028)
  #     max_attempts: 2           # Retry once — most OOM tasks succeed on a clean retry
  #     initial_backoff: 10s      # flat backoff; OOM is not time-sensitive
  #     backoff_multiplier: 1.0
  # Note: invalid_config errors always fail fast (no retry)

  # Subprocess memory limits + RSS telemetry (GH-3028)
  # RSS sampler runs on every execution (Linux: /proc/<pid>/status, macOS: ps).
  # Memory cap (Enabled=true) is a real RSS cap: a cgroup v2 memory.max leaf on
  # Linux (best-effort — degrades to telemetry-only if cgroup v2 isn't
  # mounted/delegated to the pilot process) plus a cooperative
  # NODE_OPTIONS=--max-old-space-size V8 heap bound on every platform.
  # Collect one week of peak_rss_mb data before enabling the cap.
  # GH-4401: this was RLIMIT_AS (virtual address space) through v2.241.x —
  # NEVER go back to that; it broke 100% of Linux executor subprocesses by
  # making every Node/V8 HTTPS fetch fail instantly.
  # subprocess_limits:
  #   enabled: false              # flip to true after tuning max_rss_mb
  #   max_rss_mb: 4096            # RSS cap in MiB
  #   sample_interval_sec: 10     # how often to poll RSS

  # Knowledge-graph memory injection (TASK-387) - append relevant past
  # pitfalls/patterns/decisions/learnings from .agent/knowledge/graph.json
  # to executor prompts. Recall is local computation only (no LLM call) and
  # fails open: a missing or malformed graph yields no injection, never an
  # error. Skipped entirely for LocalMode tasks (GH-2103) and projects
  # without a .agent/ directory.
  # memory_injection:
  #   enabled: true        # Master switch; false disables the block entirely
  #   max_memories: 5       # Cap on ranked memories included (also capped at ~1500 chars total)

  # Stagnation detection (GH-925) - detect and recover from stuck tasks
  # stagnation:
  #   enabled: true
  #   warn_timeout: 10m           # Warn after 10 minutes
  #   pause_timeout: 20m          # Pause after 20 minutes
  #   abort_timeout: 30m          # Abort after 30 minutes
  #   warn_at_iteration: 8        # Warn after 8 Claude turns
  #   pause_at_iteration: 12      # Pause after 12 turns
  #   abort_at_iteration: 15      # Abort after 15 turns
  #   state_history_size: 5       # Track last 5 states for loop detection
  #   identical_states_threshold: 3  # 3 identical states = loop detected
  #   grace_period: 30s           # Grace period before killing
  #   commit_partial_work: true   # Save partial progress before abort

  # Claude Code backend-specific settings (executor.type: "claude-code")
  # claude_code:
  #   gh_guard: true              # gh-guard shim (GH-4671) - default true, no need to set explicitly.
  #                                # Intercepts every `gh` CLI call the Claude Code subprocess makes:
  #                                # reads and the session's own PR/issue are always allowed; issue/PR
  #                                # lifecycle mutations (close/reopen/edit/lock/delete), cross-issue or
  #                                # cross-repo targeting, and other GitHub-state-mutating commands
  #                                # (release/repo/secret/variable/workflow) are always denied. Denials
  #                                # are journaled and surfaced as gh_guard_denied alerts. Set to false
  #                                # only if the guard blocks a legitimate `gh` usage pattern it doesn't
  #                                # yet recognize — prefer filing that as a policy gap over disabling.

# Approval workflow settings
# Pilot can require human approval before executing tasks, merging PRs, or retrying failures.
# approval:
#   enabled: false
#   default_timeout: 1h         # Fallback timeout when stage has no explicit timeout
#   default_action: rejected    # "approved" or "rejected" on timeout
#   pre_merge:
#     enabled: false
#     approvers:
#       - "${TELEGRAM_APPROVER_CHAT_ID}"   # Chat ID of the approver
#     timeout: 24h
#     default_action: rejected
#   pre_execution:
#     enabled: false
#     approvers: []
#     timeout: 1h
#     default_action: rejected
#   post_failure:
#     enabled: false
#     approvers: []
#     timeout: 1h
#     default_action: rejected

# Daily briefs configuration
briefs:
  enabled: false
  schedule: "0 9 * * 1-5"      # Cron: 9 AM weekdays
  timezone: "America/New_York"
  channels:
    # Slack channel
    - type: slack
      channel: "#dev-updates"
    # Telegram chat
    - type: telegram
      channel: "${TELEGRAM_CHAT_ID}"  # Your Telegram chat ID
    # Email recipients
    # - type: email
    #   recipients:
    #     - team@example.com
  content:
    include_metrics: true
    include_errors: true
    max_items_per_section: 10

# Alerting
# alerts:
#   enabled: true
#   channels:
#     # Two channels can share one chat_id and split by topic + severity.
#     # message_thread_id applies to forum supergroups only (Topics enabled);
#     # it is the topic's message_thread_id — the middle segment of a topic
#     # message link (https://t.me/c/<chat>/<topic>/<msg>). Omit or 0 for
#     # non-forum chats.
#     - name: telegram-critical
#       type: telegram
#       enabled: true
#       severities: [critical]
#       telegram:
#         chat_id: -1001234567890
#         message_thread_id: 12
#     - name: telegram-routine
#       type: telegram
#       enabled: true
#       severities: [warning, info]
#       telegram:
#         chat_id: -1001234567890
#         message_thread_id: 34

# Memory settings
memory:
  path: "~/.pilot/data"
  cross_project: true        # Share learnings across projects
  learning:
    enabled: true             # Enable pattern learning system
    min_confidence: 0.6       # Min confidence for prompt injection
    max_patterns: 5           # Max patterns injected per task
    include_anti: true        # Include anti-patterns in prompts

# Quality gates (GH-207) - run after implementation, before a PR is created.
# Applies to every project unless a project defines its own `quality:` block
# below (GH-3716). If neither is set, Pilot auto-detects a minimal build/test
# gate per project (Go/Makefile/npm/pnpm/yarn/bun) so unconfigured projects
# never inherit commands tuned for a different stack.
quality:
  enabled: true
  gates:
    - name: build
      type: build
      command: "make build"
      required: true
      timeout: 5m
    - name: test
      type: test
      command: "make test"
      required: true
      timeout: 10m
    - name: lint
      type: lint
      command: "make lint"
      required: false          # Warn only by default
      timeout: 2m
  on_failure:
    action: retry              # retry, fail, or warn
    max_retries: 2

# Project configurations
projects:
  # Example project
  - name: "my-app"
    path: "/path/to/my-app"
    navigator: true           # Use Navigator for context efficiency
    default_branch: "main"
    # PR reviewers - auto-assigned when Pilot creates a PR
    # reviewers:
    #   - alice
    #   - bob
    # team_reviewers:
    #   - backend-team
    # GitHub integration for PR creation
    # github:
    #   owner: "my-org"
    #   repo: "my-app"
    # Linear project pairing (GH-1684) - maps Linear project to this Pilot project
    # Precedence: project-level linear.project_id > workspace-level > default_project
    # linear:
    #   project_id: "proj-abc123"   # Linear project UUID
    # Per-project quality gates (GH-3716) - overrides the top-level `quality:`
    # block above for this project only. Useful when a deployment's global
    # gates (e.g. Go/Makefile) don't fit a project on a different stack
    # (e.g. a pnpm workspace). Resolution order: project quality > global
    # quality > auto-detected build/test gate.
    # quality:
    #   enabled: true
    #   gates:
    #     - name: build
    #       type: build
    #       command: "pnpm run build"
    #       required: true
    #       timeout: 5m
    #     - name: test
    #       type: test
    #       command: "pnpm test"
    #       required: true
    #       timeout: 10m
    # Per-project approval overlay (GH-4774) - overrides the resolved
    # env/global `require_approval` gate and `approval_source` channel for
    # this project only. Both fields are independently optional: an unset
    # field inherits from the resolved env/global autopilot config. Useful
    # when different projects need different gating strictness or should
    # route approval requests to different people/channels — e.g. a personal
    # project approved via Telegram alongside a work project approved via
    # Slack, both sharing the same autopilot.environments block.
    # approval:
    #   require_approval: true   # gate merges on human approval for this project only
    #   approval_source: "slack" # route approval asks here instead of the resolved env/global source

  # Per-project release overlay (GH-3926) - overrides autopilot.release above
  # for this project only. Overlay semantics: only the fields set here are
  # applied (project > env > global); anything left unset inherits from the
  # resolved env/global release config, so `enabled` is NOT silently turned
  # off by an overlay that only sets `publish`. Example: a project with no
  # tag-triggered release workflow of its own, so Pilot publishes the GitHub
  # Release directly via the API.
  #
  # OPT-IN REQUIRED (GH-4001): this applies ONLY to `projects:` entries
  # (below) — a project listed here with NO `release:` block never tags or
  # releases, even when autopilot.release above is enabled. The global
  # release config only cascades to the default repo (adapters.github.repo).
  # This is intentional: a repo added to `projects:` for issue-polling/PR
  # automation but never meant to auto-release (e.g. a plugin repo whose
  # releases drive an auto-updater) must not silently start tagging just
  # because global release got turned on for other repos. To opt a project
  # in, add at minimum `release: { enabled: true }` (or any block below —
  # setting any field opts the project in and inherits the rest from the
  # resolved env/global config).
  #
  # `trigger`, `scope_label_prefix`, `schedule`, and `schedule_timezone` are
  # also overlayable here (GH-3989) - release cadence is per-repo by design,
  # so one repo can run `on_merge` while another in the same autopilot config
  # runs `on_scope_close`:
  #     release: { trigger: on_scope_close }
  # - name: "studio-sdk"
  #   path: "/path/to/studio-sdk"
  #   github:
  #     owner: "qf-studio"
  #     repo: "studio-sdk"
  #   release:
  #     publish: api    # only set publish: api on repos with NO tag-triggered release
  #                     # workflow - pre-creating the release makes GoReleaser's asset
  #                     # upload 422-collide and silently skips downstream publish steps
  #                     # (Homebrew tap). Repos with GoReleaser must stay workflow.
  #     tag_human_merges: true  # also tag this project's human-authored merges (GH-3928)
  #
  # on_schedule example (GH-3993): batch everything merged since the last tag
  # into one release train, cut every Friday at 21:00 in Europe/Berlin.
  # - name: some-product
  #   path: "/path/to/some-product"
  #   github:
  #     owner: "qf-studio"
  #     repo: "some-product"
  #   release:
  #     trigger: on_schedule
  #     schedule: "0 21 * * FRI"          # Fridays 21:00
  #     schedule_timezone: "Europe/Berlin"

  # Canary/synthetic sandbox example (GH-4240/GH-4833): `canary: true` marks
  # a project as a synthetic sandbox rather than real work. Executions
  # dispatched for it are still fully persisted and event-logged, but they're
  # excluded from success-rate/cost/throughput metrics, the metrics hydrator,
  # and dashboard history — so a scheduled canary probe (e.g. a GitHub
  # Actions cron that files a real issue to prove the daemon still ships
  # code end-to-end) can run indefinitely without skewing fleet-wide
  # averages. `path` is intentionally omitted here: a repo-only registration
  # (github.owner/github.repo set, no local checkout override) is normal for
  # a project that doesn't need its own distinct working directory. GH-4833:
  # `canary` designation is matched by `github.owner`/`github.repo`
  # (config.FindProjectByRepo, the same lookup ResolveProjectBoard uses) —
  # NOT by `path` — because two projects sharing the same (or absent) `path`
  # would otherwise collide on a path-based lookup and silently resolve to
  # the wrong project's Canary flag.
  # - name: "pilot-canary-sandbox"
  #   github:
  #     owner: "qf-studio"
  #     repo: "pilot-canary-sandbox"
  #   canary: true

# Autopilot settings
autopilot:
  enabled: false
  # Default environment used when --env is not specified (default: stage)
  default_environment: "stage"
  # Global autopilot settings
  auto_merge: true
  merge_method: "squash"
  ci_wait_timeout: 30m
  ci_poll_interval: 30s
  approval_source: "telegram"   # telegram, slack, or github-review

  # GH-4391: shared GitHub rate-limit budget. The GitHub primary rate limit
  # is pooled per authenticated user across every client/session that user
  # holds, so a startup burst of wide scans across many repos can silently
  # starve the issue pollers even though `gh api rate_limit` looks fine from
  # a different token/session's view of the same pool. These three settings
  # bound that burst; defaults match the incident-driven values below.
  #
  # startup_merged_pr_scan_window: lookback for the one-time boot catch-up
  # sweep (self-heal + board write-back for PRs merged while the daemon was
  # down). Down from a hardcoded 720h (30d) — a restart minutes after the
  # last startup scan doesn't need to re-walk a month of history; it also
  # shrinks further on restart via a persisted per-repo cursor.
  startup_merged_pr_scan_window: 72h
  # rate_limit_floor_pct: once remaining/limit on the shared budget drops
  # below this fraction, background scans (merged-PR scans, orphan-PR
  # sweeps, reconciler evidence fetches) pause until headroom recovers.
  # Issue pollers and active-PR CI watches are never gated — they're the
  # highest-value consumer and must always get the reserve.
  rate_limit_floor_pct: 0.15
  # scan_stagger_interval: average delay between per-repo startup scans
  # (jittered +/- 25%), so N repos' scans spread out over roughly
  # N * scan_stagger_interval instead of all firing back-to-back at boot.
  scan_stagger_interval: 3s

  # Automatic release creation on PR merge (GH-3926).
  release:
    enabled: false
    # Release cadence (GH-3989):
    #   on_merge       (default) - cut a release for every merged PR.
    #   manual         - never auto-release.
    #   on_scope_close - hold merges belonging to an open epic (parent issue)
    #                    or a shared "scope:"-prefixed label; standalone
    #                    merges still release per-merge. The scope releases
    #                    once when it completes (scope-close reconciler ships
    #                    in a follow-up issue; this issue is config + hold
    #                    semantics only - held work is fully reconstructable
    #                    from GitHub in the meantime).
    #   on_schedule    - hold every merge for a cron release train (see
    #                    `schedule` below). At each tick, everything merged
    #                    since the last tag is batched into one validated
    #                    release (GH-3993). Restart across a tick still fires
    #                    it exactly once (missed-tick recovery, bounded by
    #                    `scope_lookback` below); a miss older than that
    #                    window needs a manual re-trigger. DST transitions
    #                    follow robfig/cron/v3's cron.WithLocation semantics
    #                    (no special-casing). Urgent hotfix under
    #                    `on_schedule`: everything still waits for the next
    #                    tick by design - flip `trigger` to `on_merge`
    #                    temporarily (config reload) if it can't wait.
    #
    # `on_scope_close`/`on_schedule` release notes (GH-3992): the aggregated
    # scope body (headline, grouped Features/Fixes/Other with #PR + GH-issue
    # links, breaking changes, What's New, compare footer) is only composed
    # for `publish: api` or `publish: workflow` — `tag_only` never creates a
    # release object, so there is nothing to attach notes to.
    trigger: on_merge
    # scope_label_prefix: "scope:"       # on_scope_close only; default "scope:"
    # schedule: "0 21 * * FRI"           # on_schedule only; robfig/cron/v3 standard (5-field) syntax
    # schedule_timezone: "Europe/Berlin" # on_schedule only; empty = daemon local time
    # scope_lookback: 24h                # on_scope_close AND on_schedule; also bounds missed-tick recovery
    version_strategy: conventional_commits
    tag_prefix: "v"
    generate_changelog: true
    notify_on_release: true
    # require_ci: wait for post-merge CI on the target branch before releasing.
    # Gates every release path — the webhook-driven merge handler AND the
    # polled external-merge/scan-recovery paths (GH-3994) — by routing through
    # the same StagePostMergeCI wait; set false to release immediately on merge.
    require_ci: true
    # generate_summary prepends an LLM (Haiku) "## What's New" summary to the
    # release body. Requires ANTHROPIC_API_KEY in the daemon's environment —
    # unset means the summary step is silently skipped (releases still ship,
    # just without it). Has no effect under `publish: tag_only` (GH-3992).
    generate_summary: true
    # Who actually publishes the GitHub Release once the tag is created:
    #   workflow  (default when empty) - Pilot only creates the tag; the repo's
    #             own tag-triggered CI (e.g. GoReleaser) publishes the release.
    #             Preserves existing behavior byte-for-byte.
    #   api       - Pilot publishes the GitHub Release itself via the API
    #             immediately after tagging. Only use this on repos with NO
    #             tag-triggered release workflow of their own (see the
    #             per-project `release.publish: api` example under `projects:`
    #             for the full warning on why this must not be combined with
    #             GoReleaser).
    #   tag_only  - the tag is created and nothing publishes a release; use
    #             for repos with an intentionally manual release process.
    publish: workflow
    # Opt-in: also consider merged PRs whose head branch is NOT pilot/* for
    # release tagging (GH-3928). Default false - zero behavior change; only
    # pilot/* branches are scanned. When true, ScanRecentlyMergedPRs also
    # picks up human-authored PRs merged into the environment's default
    # branch. Whether a release is actually cut still depends entirely on
    # conventional-commit hygiene: squash-merge means the PR TITLE becomes
    # the commit subject, so a `feat: ...`/`fix: ...` title bumps a version
    # and a non-conventional title (or `docs:`/`chore:`/`refactor:`) produces
    # no release. Merge metrics, self-heal, and board sync are unaffected -
    # those remain Pilot-PR-only regardless of this flag.
    tag_human_merges: false

  # Define named environment configurations
  # Each environment can have different branch, approval, and CI settings
  environments:
    # Development environment: fast feedback, auto-merge
    dev:
      branch: develop
      require_approval: false
      ci_timeout: 5m
      skip_post_merge_ci: true
      post_merge:
        action: "none"

    # Staging environment: wait for CI, then auto-merge
    staging:
      branch: staging
      require_approval: false
      ci_timeout: 30m
      skip_post_merge_ci: false
      post_merge:
        action: "none"

    # Production environment: requires human approval
    prod:
      branch: main
      require_approval: true
      approval_source: "telegram"
      approval_timeout: 1h
      ci_timeout: 30m
      skip_post_merge_ci: false
      merge_method: "squash"
      post_merge:
        action: "tag"
        # For webhook action:
        # webhook_url: "https://example.com/deploy"
        # webhook_secret: "${DEPLOY_WEBHOOK_SECRET}"

  # Approval configuration (per-environment override possible)
  github_review:
    poll_interval: 30s

  # CI Check Discovery (v0.34+)
  ci_checks:
    mode: auto                    # auto | manual (default: auto)
    exclude:                      # Check names to ignore in auto mode
      - "codecov/*"              # Glob patterns supported
      - "*-optional"
    # required: []                # Allowlist; when non-empty, scopes status/failure
    #                              # attribution to exactly these checks even in auto
    #                              # mode (GH-4307) — use this to shield against
    #                              # unrelated scheduled/canary checks landing on the
    #                              # same SHA instead of enumerating them in `exclude`.
    #                              # Precedence (GH-4333): a non-empty `required` here
    #                              # always wins. If empty, the deprecated top-level
    #                              # `required_checks` is used as a fallback (with a
    #                              # startup WARN). If both are empty, no allowlist is
    #                              # active and ALL non-excluded checks gate CI status.
    discovery_grace_period: 60s   # Wait for CI to start

  # Test-evidence gate (GH-4329): escalate-only, same pattern as the
  # scope-drift/size-floor gates above. Green CI proves a check concluded
  # "success" — it does NOT prove tests actually ran. When enabled, autopilot
  # fetches the completed test job's log for the merge SHA and holds
  # auto-merge (requiring human approval + posts a PR comment) if it looks
  # like CI verified nothing: zero tests ran, or the skip ratio exceeds
  # max_skip_ratio, on a PR that touches production source.
  # Default off — enable per-project once canaried (pilot repo + pilot-console first).
  test_evidence:
    enabled: false
    min_tests: 1        # escalate if fewer than this many tests ran
    max_skip_ratio: 0.5  # escalate if skipped/(run+skipped) exceeds this

  # Cross-PR platform-outage breaker (GH-4791, TASK-458 part 1). The
  # per-PR circuit breaker above is deliberately scoped to one PR at a
  # time ("so one bad PR doesn't block others") and cannot see a
  # platform-wide outage by construction — each affected PR looks like a
  # normal individual failure. This breaker correlates CI-failure
  # observations across PRs (and repos, when multiple are configured):
  # when min_correlated_prs distinct PRs observe an infra-or-unknown-class
  # CI failure within correlation_window, it opens and suppresses
  # destructive CI-failure actions (auto-close, fix-issue creation,
  # escalate-and-hold) — affected PRs simply stay parked and are
  # re-examined on a later tick. It closes again after quiet_period
  # elapses with no further infra/unknown-class failure. One process-wide
  # breaker shared by every controller (like the rate-limit budget
  # tracker), since an outage is not scoped to a single repo.
  # Default off.
  #
  # GH-4792 (TASK-458 part 2) adds, on top of part 1's correlation/suppression:
  #   - an advisory githubstatus.com corroboration probe fired once per open
  #     transition (never gates open/close — status pages lag reality)
  #   - pausing new-work admission while open (pause_admission)
  #   - suppressing merges of already-green PRs while open (CI signal is
  #     untrustworthy during a platform incident)
  #   - re-driving PRs the breaker parked back into StageWaitingCI once it
  #     closes, up to a capped number of re-adoption attempts
  platform_breaker:
    enabled: false
    min_correlated_prs: 3   # distinct PRs observing infra/unknown failures to open the breaker
    correlation_window: 15m # how far back distinct-PR observations count toward the threshold
    quiet_period: 20m       # how long with no new infra/unknown failure before it closes again
    probe_interval: 5m      # how often the periodic monitor re-checks close + re-drives held PRs
                             # during a quiet spell with no CI activity anywhere to trigger it
    pause_admission: true   # pause new-work admission (Dispatcher) while the breaker is open;
                             # set false to keep dispatching new tasks even during a suspected
                             # platform outage (merge suppression and PR-parking still apply)

# Dashboard settings
dashboard:
  refresh_interval: 1000     # ms
  show_logs: true
  # metrics_scope_path filters the TUI's store-backed metrics panels (cost
  # card, task breakdown, recent executions, lifetime tokens, sparklines) to
  # one project. Default (unset/empty) is fleet-wide, matching the
  # pilot_window_* Prometheus gauges — the daemon serves multiple repos, so
  # fleet-wide is the correct default view. Set this to a project path to
  # restore the old per-project numbers for that one repo. The git-graph
  # panel always follows the daemon's --project path, regardless of this
  # setting. (GH-4829)
  # metrics_scope_path: /path/to/one/project
